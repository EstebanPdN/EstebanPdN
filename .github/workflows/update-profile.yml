name: Update profile

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'profile.json'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install portrait dependency
        run: python -m pip install -r requirements.txt
      - name: Refresh public stats and portrait
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py
      - name: Save updated card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile-dark.svg assets/profile-light.svg assets/avatar.txt data/stats.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile age, avatar and public stats'
            git push
          fi
